name: Debug Repository Access

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Server: $GITHUB_SERVER_URL"
          ls -la
      - name: Test git clone with token (using extraheader)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="Authorization: Bearer $GITHUB_TOKEN" clone https://github.com/$GITHUB_REPOSITORY.git test-clone
          echo "Clone successful"
          ls -la test-clone
