name: Debug Repository Access

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Server: $GITHUB_SERVER_URL"
          ls -la
      - name: Test git clone with token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git test-clone
          echo "Clone successful"
          ls -la test-clone
